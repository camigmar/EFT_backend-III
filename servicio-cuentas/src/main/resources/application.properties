spring.application.name=servicio-cuentas
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:mysql://localhost:3306/banco_xyz?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
# Escalado: con debitos/creditos concurrentes que esperan el bloqueo de la misma cuenta, 10 conexiones
# (default) hacian esperar a las demas peticiones; 20 por replica.
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.show-sql=true

spring.batch.job.enabled=false
# Las tablas BATCH_* las crea db/init/02-batch-schema.sql (JobRepository JDBC, ver BatchApplication).
spring.batch.jdbc.initialize-schema=never

batch.intereses.hilos=5
batch.intereses.chunk=10

batch.transacciones.skip-limite=20
batch.transacciones.retry-limite=3
batch.intereses.skip-limite=20
batch.intereses.retry-limite=3
batch.cuentas-anuales.skip-limite=20
batch.cuentas-anuales.retry-limite=3

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Nombre logico en Eureka; lo resuelve Spring Cloud LoadBalancer.
clientes.api.base-url=http://servicio-clientes
clientes.api.connect-timeout=2s
clientes.api.read-timeout=3s

# health abierto (healthchecks); circuitbreakers exige token con scope interno (SecurityConfig).
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

# Healthcheck de Docker: /actuator/health/readiness (la app acepta trafico y su base responde), sin depender
# de Eureka ni del Config Server, para que una replica no se marque unhealthy por un servicio externo.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
