spring.application.name=servicio-pagos
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/banco_pagos?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Nombre logico en Eureka; lo resuelve Spring Cloud LoadBalancer.
cuentas.api.base-url=http://servicio-cuentas
cuentas.api.connect-timeout=2s
# 8 s: con debitos/creditos concurrentes sobre la misma cuenta, cuentas puede tardar varios segundos por los
# bloqueos de fila; con 3 s esa espera se tomaba como caida (timeout, reintentos y circuito abierto).
cuentas.api.read-timeout=8s

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

# Un pago COMPLETADO con monto mayor o igual a este valor publica ademas una alerta MONTO_ELEVADO.
alertas.monto-elevado=10000

# health abierto (healthchecks); circuitbreakers exige token con scope interno (SecurityConfig).
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

# Healthcheck de Docker: /actuator/health/readiness (la app acepta trafico y su base responde), sin depender
# de Eureka ni del Config Server, para que una replica no se marque unhealthy por un servicio externo.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Reconciliador de pagos inciertos (ReconciliadorPagos): cada cuanto revisa y desde que antiguedad toma un
# pago PENDIENTE (antes de eso puede seguir en curso en otra replica).
reconciliacion.intervalo=10s
reconciliacion.pendiente-minimo=60s
