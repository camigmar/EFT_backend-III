# Reverse proxy de entrada: un puerto por canal (8081 web, 8082 movil, 8083 cajero), repartido en round-robin
# entre las replicas de cada BFF.
#
# Proxy TCP (modulo stream) con TLS passthrough: nginx no termina HTTPS, solo reenvia la conexion cifrada al BFF,
# que sigue presentando su propio certificado (keystore.p12, clave en config-repo). Asi el trafico va cifrado de
# punta a punta hasta el BFF y el certificado no se duplica en el proxy.
#
# Las replicas se descubren por el DNS interno de Docker (127.0.0.11): el nombre del servicio resuelve a una IP
# por replica. "resolve" vuelve a consultarlo cada 5 s, asi que replicas nuevas (--scale) o detenidas entran y
# salen del reparto sin reiniciar nginx. Si una replica no acepta la conexion, se reintenta con la siguiente.

worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # $upstream_addr muestra la replica (IP:puerto) que atendio cada conexion.
    log_format canal '$remote_addr [$time_local] puerto=$server_port replica=$upstream_addr '
                     'estado=$status bytes_enviados=$bytes_sent duracion=$session_time';
    access_log /dev/stdout canal;

    upstream bff_web {
        zone bff_web 64k;
        server bff-web:8081 resolve max_fails=1 fail_timeout=10s;
    }

    upstream bff_movil {
        zone bff_movil 64k;
        server bff-movil:8082 resolve max_fails=1 fail_timeout=10s;
    }

    upstream bff_cajero {
        zone bff_cajero 64k;
        server bff-cajero:8083 resolve max_fails=1 fail_timeout=10s;
    }

    proxy_connect_timeout 2s;
    proxy_next_upstream on;
    proxy_next_upstream_tries 3;

    server {
        listen 8081;
        proxy_pass bff_web;
    }

    server {
        listen 8082;
        proxy_pass bff_movil;
    }

    server {
        listen 8083;
        proxy_pass bff_cajero;
    }
}
