spring.application.name=servicio-auditoria
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/banco_auditoria?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=auditoria
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Productor solo para reenviar a <topico>.DLT los mensajes que no se pudieron procesar.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Healthcheck de Docker: /actuator/health/readiness (la app acepta trafico y su base responde), sin depender
# de Eureka ni del Config Server, para que una replica no se marque unhealthy por un servicio externo.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
