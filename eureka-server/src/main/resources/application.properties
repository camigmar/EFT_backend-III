spring.application.name=eureka-server
server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Escalado: la cache de respuestas del registro se refresca cada 5 s (antes 30 s), para que los clientes
# vean pronto una replica nueva o una que se dio de baja.
eureka.server.response-cache-update-interval-ms=5000
