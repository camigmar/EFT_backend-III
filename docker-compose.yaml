name: banco-xyz

# Orden de arranque (depends_on + healthcheck):
#   1. mysql, kafka, config-server y eureka-server (infraestructura, sin dependencias entre si)
#   2. auth-server, servicio-clientes (config-server, eureka-server y mysql sanos)
#      y servicio-auditoria (ademas kafka sano)
#   3. servicio-cuentas (necesita config-server, eureka-server, mysql y kafka sanos)
#   4. bff-web, bff-movil y bff-cajero (necesitan ademas auth-server y servicio-cuentas sanos)
#      y servicio-pagos (necesita config-server, eureka-server, mysql, kafka y servicio-cuentas sanos)
#   5. reverse-proxy (nginx), cuando los tres BFF estan sanos: unico punto de entrada a los canales.
#
# Dentro de la red de compose cada servicio se alcanza por su nombre, no por localhost.
# Los application.properties leen CONFIG_SERVER_URL y EUREKA_URL (con localhost por defecto),
# asi que aqui se definen con los nombres de los servicios. El resto de variables sobrescribe
# propiedades directamente por relaxed binding (SPRING_DATASOURCE_URL -> spring.datasource.url).
#
# Escalado horizontal: servicio-cuentas, -clientes, -pagos, -auditoria y los tres BFF no tienen
# container_name ni puertos publicados, asi que admiten varias replicas:
#   docker compose up -d --scale servicio-cuentas=2 --scale servicio-pagos=2 --scale bff-cajero=2
# o con el archivo de ejemplo (2 replicas de cuentas, pagos y bff-cajero):
#   docker compose -f docker-compose.yaml -f docker-compose.escalado.yaml up -d
# Entre servicios, Eureka + Spring Cloud LoadBalancer reparten las llamadas entre replicas; hacia los BFF
# reparte nginx (reverse-proxy). Una replica nueva o detenida tarda ~30-60 s en reflejarse en los clientes
# Eureka (cache del registro + cache del LoadBalancer); nginx la ve en ~5 s (DNS de Docker).
# auth-server, config-server y eureka-server no se escalan (auth-server genera su clave RSA en memoria).

# Limites de recursos comunes. El heap (-Xmx en JAVA_TOOL_OPTIONS) queda por debajo de mem_limit para
# dejar espacio al metaspace, los hilos y el resto de la JVM.
x-recursos-app: &recursos-app
  mem_limit: 512m
  cpus: 1.0

x-recursos-infra-java: &recursos-infra-java
  mem_limit: 448m
  cpus: 0.75

# Healthcheck HTTP por readiness (/actuator/health/readiness: la app acepta trafico y, en los servicios con base
# de datos, MySQL responde). No depende de Eureka ni del Config Server. start_period amplio por el limite de CPU.
x-healthcheck-app: &healthcheck-app
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 90s

services:

  mysql:
    image: mysql:8
    mem_limit: 768m
    cpus: 1.0
    environment:
      # Mismo valor que cifra el Config Server para cuentas, clientes, pagos y auditoria; limitacion conocida, entorno de desarrollo.
      MYSQL_ROOT_PASSWORD: NuevaClave123
      MYSQL_DATABASE: banco_xyz
    volumes:
      - mysql-data:/var/lib/mysql
      # Los scripts de este directorio solo se ejecutan la primera vez, con el volumen vacio.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      # Por TCP (127.0.0.1) y no por socket: mientras carga el dump MySQL solo escucha por socket,
      # asi el servicio queda sano recien cuando termino la inicializacion.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:latest
    mem_limit: 1g
    cpus: 1.0
    # KRaft de un solo nodo: el mismo proceso es broker y controller. Solo accesible dentro de la red.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  config-server:
    image: banco/config-server:latest
    build:
      context: .
      dockerfile: config-server/Dockerfile
    restart: on-failure
    <<: *recursos-infra-java
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      retries: 10
      start_period: 40s

  eureka-server:
    image: banco/eureka-server:latest
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    restart: on-failure
    <<: *recursos-infra-java
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      retries: 10
      start_period: 40s

  auth-server:
    image: banco/auth-server:latest
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    restart: on-failure
    <<: *recursos-infra-java
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      # application.properties usa configserver:${CONFIG_SERVER_URL:http://localhost:8888}.
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      retries: 10
      start_period: 40s

  servicio-cuentas:
    image: banco/servicio-cuentas:latest
    build:
      context: .
      dockerfile: servicio-cuentas/Dockerfile
    restart: on-failure
    mem_limit: 640m
    cpus: 1.0
    # Sin puerto publicado: solo se alcanza dentro de la red de compose (los BFF y pagos la encuentran
    # via Eureka) y exige un token de servicios-internos con scope "interno". Escalable: los jobs batch
    # se disparan por endpoint y el JobRepository JDBC compartido impide ejecutarlos dos veces.
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      # Registra la IP del contenedor en Eureka en vez de su hostname interno.
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banco_xyz?createDatabaseIfNotExists=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness"]
      <<: *healthcheck-app

  servicio-clientes:
    image: banco/servicio-clientes:latest
    build:
      context: .
      dockerfile: servicio-clientes/Dockerfile
    restart: on-failure
    <<: *recursos-app
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      # Base de datos propia del servicio, en la misma instancia de MySQL.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banco_clientes?createDatabaseIfNotExists=true
    # Sin puerto publicado: solo accesible dentro de la red, con token de servicios-internos (scope "interno").
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health/readiness"]
      <<: *healthcheck-app

  servicio-pagos:
    image: banco/servicio-pagos:latest
    build:
      context: .
      dockerfile: servicio-pagos/Dockerfile
    restart: on-failure
    <<: *recursos-app
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      servicio-cuentas:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      # Base de datos propia del servicio, en la misma instancia de MySQL.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banco_pagos?createDatabaseIfNotExists=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Sin puerto publicado: solo accesible dentro de la red, con token de servicios-internos (scope "interno").
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/actuator/health/readiness"]
      <<: *healthcheck-app

  # Los BFF no publican puertos: se entra por reverse-proxy (8081, 8082, 8083), que reparte entre sus replicas.
  bff-web:
    image: banco/bff-web:latest
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    restart: on-failure
    <<: *recursos-app
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      servicio-cuentas:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      # Las claves publicas para validar los tokens se descargan de auth-server dentro de la red.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8081/actuator/health/readiness"]
      <<: *healthcheck-app

  bff-movil:
    image: banco/bff-movil:latest
    build:
      context: .
      dockerfile: bff-movil/Dockerfile
    restart: on-failure
    <<: *recursos-app
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      servicio-cuentas:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8082/actuator/health/readiness"]
      <<: *healthcheck-app

  bff-cajero:
    image: banco/bff-cajero:latest
    build:
      context: .
      dockerfile: bff-cajero/Dockerfile
    restart: on-failure
    <<: *recursos-app
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      servicio-cuentas:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://auth-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8083/actuator/health/readiness"]
      <<: *healthcheck-app

  # Punto de entrada externo de los canales. Proxy TCP con TLS passthrough (ver nginx/nginx.conf): el HTTPS
  # lo siguen terminando los BFF; nginx solo reparte las conexiones entre las replicas de cada BFF.
  reverse-proxy:
    image: nginx:1.28-alpine
    restart: on-failure
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      bff-web:
        condition: service_healthy
      bff-movil:
        condition: service_healthy
      bff-cajero:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 && nc -z 127.0.0.1 8082 && nc -z 127.0.0.1 8083"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  servicio-auditoria:
    image: banco/servicio-auditoria:latest
    build:
      context: .
      dockerfile: servicio-auditoria/Dockerfile
    restart: on-failure
    <<: *recursos-app
    # Sin puerto publicado ni container_name para poder escalarlo con --scale. La API de consulta
    # (/api/auditoria/**) se usa desde dentro de la red: http://servicio-auditoria:8084.
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Base de jwk-set-uri (validar JWT) y token-uri (token de servicios-internos) en config-repo.
      AUTH_SERVER_URL: http://auth-server:9000
      # Base de datos propia del servicio, en la misma instancia de MySQL.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/banco_auditoria?createDatabaseIfNotExists=true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health/readiness"]
      <<: *healthcheck-app

volumes:
  mysql-data:
