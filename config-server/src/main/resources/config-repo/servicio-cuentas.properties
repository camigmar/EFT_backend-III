# Resource server: valida los JWT de auth-server con su JWKS (se vuelve a descargar si cambia la clave).
# AUTH_SERVER_URL lo define docker-compose; el placeholder lo resuelve el servicio, no el Config Server.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks

# Token client_credentials de servicios-internos para llamar a otros servicios (seguridad-interna).
servicios-internos.token-uri=${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token
servicios-internos.client-id=servicios-internos
servicios-internos.client-secret={cipher}a5d4426e535a3b13e295fcfc6b8d33d5b76216f99f7b21c5866658fe7cb399f251f5c46636ee4e328ddec41aa39712f515d40664d68bc8053b2188cbd08ad6f1
servicios-internos.scope=interno

# Resilience4j cuentas -> clientes (GET, idempotente). Retry solo ante "no disponible", nunca ante 4xx.
resilience4j.retry.instances.clientes.max-attempts=3
resilience4j.retry.instances.clientes.wait-duration=300ms
resilience4j.retry.instances.clientes.enable-exponential-backoff=true
resilience4j.retry.instances.clientes.exponential-backoff-multiplier=2
resilience4j.retry.instances.clientes.retry-exceptions=com.banco.core.exception.ClientesNoDisponibleException
resilience4j.circuitbreaker.instances.clientes.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.clientes.sliding-window-size=6
resilience4j.circuitbreaker.instances.clientes.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.clientes.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clientes.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.clientes.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.clientes.record-exceptions=com.banco.core.exception.ClientesNoDisponibleException
resilience4j.circuitbreaker.instances.clientes.register-health-indicator=true

# Escalado: el registro de Eureka y la cache del LoadBalancer se refrescan cada 5 s (antes 30 s y 35 s),
# para dejar de enviar trafico a una replica detenida, y empezar a usar una nueva, en segundos.
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
